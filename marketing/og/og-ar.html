<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #14202e; color: #f5f2ea; font-family: 'IBM Plex Sans Arabic', sans-serif; position: relative; }
  .photo { position: absolute; top: 0; bottom: 0; inset-inline-end: 0; width: 470px; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 30% 20%; display: block; }
  .photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, transparent 40%, #14202e 98%); }

  .text { position: absolute; top: 70px; bottom: 70px; inset-inline-start: 72px; width: 640px; display: flex; flex-direction: column; }
  .kicker { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; color: rgba(245,242,234,.7); }
  .kicker i { width: 14px; height: 14px; background: #f5b700; display: block; }
  h1 { margin-top: 22px; font-size: 80px; font-weight: 700; line-height: 1.15; }
  h1 span { color: #f5b700; }
  .role { margin-top: 10px; font-size: 30px; color: rgba(245,242,234,.8); }
  .services { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; }
  .services span { border: 1px solid rgba(245,242,234,.25); padding: 8px 16px; font-size: 20px; color: rgba(245,242,234,.85); }
  .phone { margin-top: auto; display: flex; align-items: center; gap: 16px; }
  .phone .icons { display: flex; gap: 8px; color: #f5b700; }
  .phone svg { width: 32px; height: 32px; }
  .phone .num { font-family: 'IBM Plex Mono', monospace; font-size: 40px; font-weight: 600; direction: ltr; }
  .tape { position: absolute; bottom: 0; left: 0; right: 0; height: 14px;
    background: repeating-linear-gradient(-45deg, #f5b700 0 16px, #14202e 16px 32px); }
</style>
</head>
<body>
  <div class="photo"><img src="../../public/images/alaa-assi-electrician-ramallah-800.webp" alt=""></div>
  <div class="text">
    <p class="kicker"><i></i>كهربائي · رام الله والبيرة</p>
    <h1><span>م.</span> علاء عاصي</h1>
    <p class="role">مهندس وفني كهرباء</p>
    <div class="services"><span>تمديدات</span><span>صيانة أعطال</span><span>لوحات توزيع</span><span>طاقة شمسية</span></div>
    <div class="phone">
      <span class="icons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5 5 16a8.5 8.5 0 1 1 3 3Z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 1a4 4 0 0 1-2-2l1-1-1-2Z"/></svg></span>
      <span class="num">052 955 7602</span>
    </div>
  </div>
  <div class="tape"></div>
</body>
</html>
